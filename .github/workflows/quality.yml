name: EcoScholar quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/api
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: PYTHONPATH=backend python backend/evaluation/metrics.py
      - run: PYTHONPATH=backend python backend/evaluation/benchmark.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7
        with:
          node-version: 22
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
